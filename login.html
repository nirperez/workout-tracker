<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b14">
  <title>התחברות | האימונים שלי</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login">
    <h1>האימונים שלי</h1>
    <p class="muted">נכנסים עם מייל וסיסמה, ונשארים מחוברים במכשיר הזה.</p>
    <form id="form">
      <input id="email" type="email" required placeholder="מייל" autocomplete="username" dir="ltr">
      <input id="password" type="password" required minlength="6" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password" dir="ltr">
      <button class="primary" type="submit" id="signIn">כניסה</button>
      <button type="button" id="signUp">פעם ראשונה? יצירת סיסמה</button>
    </form>
    <p id="msg" class="muted" role="status"></p>
  </div>
  <script type="module">
    import { sb, demo } from './js/supabase.js';
    const home = new URL('index.html', location.href).href;
    if (demo) location.replace(home);
    else {
      const { data: { session } } = await sb.auth.getSession();
      if (session) location.replace(home);
    }

    const $ = (id) => document.getElementById(id);
    const reasons = {
      invalid_credentials: 'המייל או הסיסמה לא נכונים.',
      signup_disabled: 'המייל הזה לא מורשה להיכנס לאתר.',
      user_already_exists: 'כבר יש חשבון למייל הזה. לחץ על "כניסה".',
      weak_password: 'הסיסמה חלשה מדי. בחר סיסמה של 6 תווים לפחות.',
      email_not_confirmed: 'המייל עדיין לא אושר.',
      over_request_rate_limit: 'יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.',
    };

    async function run(action) {
      const form = $('form');
      if (!form.reportValidity()) return;
      const creds = { email: $('email').value.trim(), password: $('password').value };
      form.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      $('msg').textContent = 'רגע...';
      const { data, error } = action === 'up'
        ? await sb.auth.signUp(creds)
        : await sb.auth.signInWithPassword(creds);
      form.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      if (error) {
        console.error(error);
        $('msg').textContent = reasons[error.code]
          || (action === 'up' ? 'לא הצלחתי ליצור חשבון למייל הזה.' : 'הכניסה נכשלה. נסה שוב.');
        return;
      }
      if (data.session) location.replace(home);
      else $('msg').textContent = 'כבר יש חשבון למייל הזה. לחץ על "כניסה".';
    }

    $('form').addEventListener('submit', (e) => { e.preventDefault(); run('in'); });
    $('signUp').addEventListener('click', () => run('up'));
  </script>
</body>
</html>

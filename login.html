<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b14">
  <title>התחברות | האימונים שלי</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login">
    <h1>האימונים שלי</h1>
    <p class="muted">מקלידים מייל, מקבלים קישור התחברות, ונשארים מחוברים במכשיר הזה.</p>
    <form id="form">
      <input id="email" type="email" required placeholder="המייל שלך" autocomplete="email" dir="ltr">
      <button class="primary" type="submit">שלח לי קישור התחברות</button>
    </form>
    <p id="msg" class="muted" role="status"></p>
  </div>
  <script type="module">
    import { sb, demo } from './js/supabase.js';
    const home = new URL('index.html', location.href).href;
    if (demo) location.replace(home);
    else {
      const { data: { session } } = await sb.auth.getSession();
      if (session) location.replace(home);
    }
    const msg = document.getElementById('msg');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      msg.textContent = 'שולח...';
      const { error } = await sb.auth.signInWithOtp({
        email: document.getElementById('email').value.trim(),
        options: { emailRedirectTo: home },
      });
      btn.disabled = false;
      msg.textContent = error
        ? 'השליחה נכשלה. נסה שוב בעוד דקה.'
        : 'נשלח. פתח את המייל במכשיר הזה ולחץ על הקישור.';
    });
  </script>
</body>
</html>

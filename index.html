<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b14">
  <title>אימון | האימונים שלי</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="timer-bar">
    <div class="timer-inner">
      <div>
        <div class="timer-value" id="timer">00:00</div>
        <div class="timer-label" id="timerLabel">לחץ התחל כדי להתחיל לספור</div>
      </div>
      <button class="primary" id="startBtn">התחל אימון</button>
    </div>
  </header>

  <main>
    <div class="banner" id="demoBanner" hidden>מצב הדגמה: הנתונים נשמרים רק בדפדפן הזה עד שמחברים את Supabase.</div>
    <div class="banner" id="resumeBanner" hidden></div>
    <div id="exercises" style="margin-top:14px"><p class="empty">טוען...</p></div>

    <div class="actions">
      <button class="primary block" id="saveBtn" disabled>סיים ושמור אימון</button>
      <div class="row">
        <button id="editPlanBtn">ערוך תוכנית</button>
        <button class="danger ghost" id="discardBtn">בטל אימון</button>
      </div>
    </div>
  </main>

  <dialog id="planDialog">
    <h2>עריכת התוכנית</h2>
    <div id="planList"></div>
    <form class="plan-add" id="planAdd">
      <input id="planNew" placeholder="שם תרגיל חדש" autocomplete="off">
      <button class="primary" type="submit">הוסף</button>
    </form>
    <button class="block" id="planClose">סיום</button>
  </dialog>

  <dialog id="summaryDialog">
    <h2>האימון נשמר</h2>
    <div id="summaryBody"></div>
    <button class="primary block" id="summaryClose" style="margin-top:14px">סגור</button>
  </dialog>

  <nav class="tabs">
    <a class="active" href="index.html">אימון</a>
    <a href="history.html">האימונים שלי</a>
    <a href="dashboard.html">התקדמות</a>
  </nav>

  <script type="module" src="js/workout.js"></script>
</body>
</html>
